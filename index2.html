<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蛙仔盲盒日記 - 數據管理後台</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #fff;
            --text-dark: #6e655f;
            --text-light: #baaf9a;
            --primary-color: #796e65;
            --primary-hover: #5c524a;
            --line-color: #e6dfd3;
            --accent-pink: #fbebe8;
            --accent-pink-text: #e29385;
            --accent-gray: #eae7e1;
            --accent-gray-text: #8c8275;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 8px 24px rgba(121, 110, 101, 0.04);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 4px;
            color: var(--text-dark);
            text-indent: 6px;
        }

        .subtitle-badge {
            display: block;
            width: fit-content;
            margin: 0 auto 24px auto;
            background-color: var(--accent-pink);
            color: var(--accent-pink-text);
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
        }

        /* 頂部數據看板 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-color);
            border: 1px solid var(--line-color);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        /* 表單區域 */
        .form-box {
            border: 1px solid var(--line-color);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 橫排 Flexbox 容器 */
        .form-row-flexible {
            display: flex;
            width: 100%;
            gap: 10px; /* 統一欄位之間的間距 */
        }

        /* 第一排：三等分 (33.33%) */
        .form-row-flexible.row-3 > * {
            flex: 1;
            width: 0; /* 確保在 Flex 彈性下等分 */
        }

        /* 第二排與第三排：二等分 (50%) */
        .form-row-flexible.row-2 > * {
            flex: 1;
            width: 0; /* 確保在 Flex 彈性下等分 */
        }

        /* 輸入框與選擇框基礎樣式 */
        input, select {
            display: block;
            height: 38px;
            border: 1px solid var(--line-color);
            border-radius: 10px;
            padding: 0 10px;
            font-size: 0.85rem;
            color: var(--text-dark);
            background: #fff;
            outline: none;
            transition: border .2s;
            text-align: center;
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            font-variant-numeric: tabular-nums;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input:focus, select:focus {
            border-color: var(--text-light);
        }

        /* 日期欄位樣式優化 */
        input[type="date"] {
            position: relative;
            padding-right: 10px;
            text-align: center;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.5;
        }

        /* 下拉選單小箭頭 */
        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23baaf9a' d='M0,0 L5,5 L10,0 Z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 28px;
            text-align-last: center; /* 確保下拉文字置中 */
        }

        /* 移除數字欄位小箭頭 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Placeholder 顏色 */
        ::placeholder {
            color: #ccc;
            font-size: 0.85rem;
        }

        /* 新增按鈕 */
        .submit-btn {
            width: 100%;
            height: 44px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            letter-spacing: 4px;
            cursor: pointer;
            transition: background-color .2s;
            margin-top: 4px;
            text-indent: 4px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        /* 歷史紀錄區域 */
        .record-section {
            margin-top: 10px;
        }

        .year-selector-wrapper {
            margin-bottom: 16px;
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .record-table th {
            color: var(--text-light);
            font-weight: normal;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line-color);
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .record-table td {
            padding: 12px 4px;
            text-align: center;
            vertical-align: middle;
        }

        /* 標籤小貼紙 */
        .badge-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .badge-gray {
            background-color: var(--accent-gray);
            color: var(--accent-gray-text);
        }

        .badge-pink {
            background-color: var(--accent-pink);
            color: var(--accent-pink-text);
        }

        /* 刪除按鈕 */
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.4;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 0.9;
        }

        .delete-btn svg {
            width: 16px;
            height: 16px;
            fill: #6e655f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>蛙仔盲盒日記</h1>
    <span class="subtitle-badge">數據管理後台</span>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">人數</div>
            <div class="stat-value" id="stat-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">加值</div>
            <div class="stat-value" id="stat-bonus">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">總計</div>
            <div class="stat-value" id="stat-total">0</div>
        </div>
    </div>

    <div class="form-box">
        <div class="form-row-flexible row-3">
            <input type="date" id="input-date">
            <input type="text" id="input-name" placeholder="名字">
            <input type="text" id="input-country" placeholder="國籍">
        </div>
        
        <div class="form-row-flexible row-2">
            <select id="input-plan">
                <option value="" disabled selected hidden>方案</option>
                <option value="5S">5S</option>
                <option value="6S">6S</option>
                <option value="-">-</option>
            </select>
            <select id="input-bonus-type">
                <option value="" disabled selected hidden>加值</option>
                <option value="喇喇">喇喇</option>
                <option value="O爆">O爆</option>
                <option value="-">-</option>
            </select>
        </div>

        <div class="form-row-flexible row-2">
            <input type="number" id="input-tip" placeholder="小費">
            <input type="number" id="input-amount" placeholder="金額">
        </div>

        <button class="submit-btn" onclick="addRecord()">新 增 記 錄</button>
    </div>

    <div class="record-section">
        <div class="year-selector-wrapper">
            <select id="year-filter" onchange="renderTable()">
                </select>
        </div>

        <table class="record-table">
            <thead>
                <tr>
                    <th style="width: 12%;">日期</th>
                    <th style="width: 14%;">名字</th>
                    <th style="width: 14%;">國籍</th>
                    <th style="width: 14%;">方案</th>
                    <th style="width: 14%;">加值</th>
                    <th style="width: 14%;">小費</th>
                    <th style="width: 14%;">金額</th>
                    <th style="width: 4%;"></th>
                </tr>
            </thead>
            <tbody id="record-tbody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // 預設載入當天日期
    document.getElementById('input-date').valueAsDate = new Date();

    // 從 localStorage 讀取資料
    let records = JSON.parse(localStorage.getItem('frog_records')) || [];

    // 初始化網頁
    function init() {
        updateYearFilterOptions();
        updateStats();
        renderTable();
    }

    // 更新統計看板
    function updateStats() {
        const count = records.length;
        
        let bonusCount = 0;
        let totalAmount = 0;

        records.forEach(r => {
            if (r.bonusType && r.bonusType !== '-') {
                bonusCount++;
            }
            totalAmount += (Number(r.amount) || 0);
        });

        document.getElementById('stat-count').innerText = count;
        document.getElementById('stat-bonus').innerText = bonusCount;
        document.getElementById('stat-total').innerText = totalAmount.toLocaleString();
    }

    // 自動更新年份下拉選單選項
    function updateYearFilterOptions() {
        const yearFilter = document.getElementById('year-filter');
        const currentYear = new Date().getFullYear();
        
        // 抓出所有資料中的年份，並加上今年
        let years = [currentYear];
        records.forEach(r => {
            if (r.date) {
                const y = new Date(r.date).getFullYear();
                if (!years.includes(y) && !isNaN(y)) years.push(y);
            }
        });

        // 由大到小排序
        years.sort((a, b) => b - a);

        yearFilter.innerHTML = '';
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = `${y} 年度紀錄`;
            yearFilter.appendChild(opt);
        });
    }

    // 渲染表格資料
    function renderTable() {
        const tbody = document.getElementById('record-tbody');
        tbody.innerHTML = '';

        const selectedYear = Number(document.getElementById('year-filter').value);

        // 篩選出該年份的資料
        const filteredRecords = records.filter(r => {
            return new Date(r.date).getFullYear() === selectedYear;
        });

        // 依照日期由新到舊排序
        filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

        filteredRecords.forEach(r => {
            const tr = document.createElement('tr');

            // 格式化日期顯示 (例如 2026/06/07 -> 06/07)
            let displayDate = '';
            if (r.date) {
                const parts = r.date.split('-');
                if (parts.length === 3) displayDate = `${parts[1]}/${parts[2]}`;
            }

            // 方案與加值的標籤優化處理
            const planHtml = (r.plan && r.plan !== '-') ? `<span class="badge-pill badge-gray">${r.plan}</span>` : '-';
            const bonusHtml = (r.bonusType && r.bonusType !== '-') ? `<span class="badge-pill badge-pink">${r.bonusType}</span>` : '-';

            tr.innerHTML = `
                <td>${displayDate}</td>
                <td>${r.name || '-'}</td>
                <td>${r.country || '-'}</td>
                <td>${planHtml}</td>
                <td>${bonusHtml}</td>
                <td>${r.tip ? Number(r.tip).toLocaleString() : '-'}</td>
                <td style="font-weight: bold;">${r.amount ? Number(r.amount).toLocaleString() : '0'}</td>
                <td>
                    <button class="delete-btn" onclick="deleteRecord('${r.id}')" title="刪除">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 新增紀錄功能
    function addRecord() {
        const date = document.getElementById('input-date').value;
        const name = document.getElementById('input-name').value.trim();
        const country = document.getElementById('input-country').value.trim();
        const plan = document.getElementById('input-plan').value;
        const bonusType = document.getElementById('input-bonus-type').value;
        const tip = document.getElementById('input-tip').value;
        const amount = document.getElementById('input-amount').value;

        if (!date) {
            alert('請選擇日期！');
            return;
        }

        const newRecord = {
            id: Date.now().toString(), // 用時間戳當唯一 ID
            date,
            name,
            country,
            plan: plan || '-',
            bonusType: bonusType || '-',
            tip: tip ? Number(tip) : '',
            amount: amount ? Number(amount) : 0
        };

        records.push(newRecord);
        localStorage.setItem('frog_records', JSON.stringify(records));

        // 重置表單輸入框（日期保留，下拉選單重置回預設提示文字）
        document.getElementById('input-name').value = '';
        document.getElementById('input-country').value = '';
        document.getElementById('input-plan').selectedIndex = 0;
        document.getElementById('input-bonus-type').selectedIndex = 0;
        document.getElementById('input-tip').value = '';
        document.getElementById('input-amount').value = '';

        // 更新畫面
        updateYearFilterOptions();
        updateStats();
        renderTable();
    }

    // 刪除紀錄功能
    function deleteRecord(id) {
        if (confirm('確定要刪除這筆紀錄嗎？')) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem('frog_records', JSON.stringify(records));
            
            updateYearFilterOptions();
            updateStats();
            renderTable();
        }
    }

    // 啟動程式
    init();
</script>

</body>
</html>
