<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛙仔盲盒日記 - 數據管理版</title>

<style>
:root{
    --bg-color:#f2f0eb;
    --card-bg:#ffffff;
    --accent:#7a6f66;
    --text-dark:#4a4a4a;
    --text-light:#9e9e9e;
    --line-color:#e8e6e1;
    --pill-bg:#ebe8e2;
    --pill-text:#8c837a;
    --addon-bg:#fdf2f2;
    --addon-text:#e59a9a;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
}

body{
    background:var(--bg-color);
    color:var(--text-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display:flex;
    justify-content:center;
    padding:12px;
}

/* 主容器 */
.container{
    width:100%;
    max-width:480px;
    background:var(--card-bg);
    border-radius:24px;
    padding:20px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.03);
    overflow:hidden;
    transition:all .3s ease;
}

header h1{
    text-align:center;
    font-weight:300;
    letter-spacing:6px;
    font-size:1.2rem;
    color:var(--accent);
    margin:0 0 20px 0;
}

/* 數據管理模式小標籤 */
.mode-badge {
    text-align:center;
    font-size:0.6rem;
    color:#fff;
    background:#e59a9a;
    width:fit-content;
    margin:-15px auto 20px auto;
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:1px;
}

/* 統計看板 */
.summary-box{
    background:#faf9f7;
    border-radius:16px;
    display:flex;
    margin-bottom:22px;
    border:1px solid var(--line-color);
    height:82px;
    overflow:hidden;
}

.summary-item{
    flex:1;
    border-right:1px solid var(--line-color);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.summary-item:last-child{
    border-right:none;
}

.summary-item span{
    font-size:0.65rem;
    color:var(--text-light);
    margin-bottom:4px;
}

.summary-item b{
    font-size:1.15rem;
    color:var(--accent);
    line-height:1;
    white-space:nowrap;
}

/* 動態輸入區 */
.input-group {
    background-color: #faf9f7;
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 22px;
    border: 1px solid var(--line-color);
}
.input-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}
.input-row:last-of-type {
    margin-bottom: 12px;
}
input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--line-color);
    border-radius: 10px;
    outline: none;
    font-size: 0.75rem;
    color: var(--text-dark);
    background: #fff;
}
input::placeholder {
    color: var(--text-light);
}
.add-btn {
    width: 100%;
    padding: 12px;
    background-color: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.85rem;
    letter-spacing: 4px;
    font-weight: bold;
    transition: background 0.2s;
}
.add-btn:active {
    background-color: #635952;
}

/* 表格與極簡彈性列面 */
.table-wrapper{
    width:100%;
}

.flex-row{
    display:flex;
    align-items:center;
    width:100%;
    text-align:center;
    padding:12px 0;
    min-width:0;
}

/* 欄位寬度完全配對你的極簡 UI */
.c-date{ width:48px; flex-shrink:0; }
.c-name{ width:58px; flex-shrink:0; font-weight:600; }
.c-nat{ width:44px; flex-shrink:0; }
.c-plan, .c-add, .c-tip{ flex:1; min-width:0; }
.c-amt{ width:86px; flex-shrink:0; text-align:right; font-weight:700; color:var(--accent); white-space:nowrap; padding-right:2px; display:flex; align-items:center; justify-content:flex-end; gap:4px; }

.list-header{
    border-bottom:1px solid var(--line-color);
    padding-bottom:10px;
    margin-bottom:6px;
}
.list-header span{
    font-size:0.65rem;
    color:var(--text-light);
    font-weight:bold;
    white-space:nowrap;
}

/* 年度與內容收折 */
.year-section{
    margin-bottom:10px;
}
.year-header{
    background:#faf9f7;
    border-radius:12px;
    border:1px solid var(--line-color);
    margin:10px 0;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    user-select:none;
}
.year-title{
    font-size:0.9rem;
    font-weight:600;
    color:var(--accent);
}
.arrow{
    font-size:0.7rem;
    color:var(--text-light);
    transition:transform .35s ease;
}
.rotate-arrow{
    transform:rotate(-90deg);
}

.content-container{
    overflow:hidden;
    max-height:5000px;
    opacity:1;
    transition: max-height .45s ease, opacity .3s ease;
}
.content-container.collapsed{
    max-height:0 !important;
    opacity:0;
}

.list-item{
    border-bottom:1px solid #f7f7f7;
    font-size:0.72rem;
}

/* 標籤樣式 */
.pills{
    display:inline-block;
    font-size:0.55rem;
    background:var(--pill-bg);
    color:var(--pill-text);
    padding:2px 5px;
    border-radius:4px;
    white-space:nowrap;
}
.addon-pill{
    background:var(--addon-bg);
    color:var(--addon-text);
    font-weight:bold;
}

/* 後台刪除按鈕 */
.del-btn {
    background: none;
    border: none;
    font-size: 0.65rem;
    cursor: pointer;
    padding: 2px;
    opacity: 0.2;
    transition: opacity 0.2s;
}
.del-btn:hover, .del-btn:active {
    opacity: 1;
}

/* 備份按鈕底座 */
.footer{
    text-align:center;
    margin-top:32px;
    padding:12px;
    font-size:0.62rem;
    color:var(--text-light);
}
.btn-link {
    display: inline-block;
    text-decoration: underline;
    cursor: pointer;
    margin: 0 10px;
    opacity: .5;
    letter-spacing: 2px;
}

/* 📱 手機優化 */
@media (max-width:480px){
    .container{
        border-radius:20px;
        padding:18px 12px;
    }
    .list-item{ font-size:0.69rem; }
    .c-date{ width:45px; }
    .c-name{ width:54px; }
    .c-nat{ width:40px; }
    .c-amt{ width:82px; }
}

/* 💻 電腦版自動放大 */
@media (min-width:900px){
    body{ padding:30px; }
    .container{ max-width:760px; padding:30px 26px; border-radius:30px; }
    header h1{ font-size:1.7rem; letter-spacing:12px; margin-bottom:10px; }
    .mode-badge { margin-bottom: 28px; font-size: 0.8rem; }
    .summary-box{ height:95px; margin-bottom:28px; }
    .summary-item span{ font-size:0.8rem; }
    .summary-item b{ font-size:1.5rem; }
    .input-group { padding: 20px; border-radius: 20px; margin-bottom: 28px; }
    input { font-size: 0.9rem; padding: 12px; border-radius: 12px; }
    .add-btn { font-size: 1rem; padding: 14px; }
    .flex-row{ padding:18px 0; }
    .list-header span{ font-size:0.82rem; }
    .list-item{ font-size:0.92rem; }
    .year-header{ padding:18px 20px; }
    .year-title{ font-size:1rem; }
    .c-date{ width:75px; }
    .c-name{ width:90px; }
    .c-nat{ width:70px; }
    .c-amt{ width:125px; font-size:1rem; }
    .del-btn { font-size: 0.85rem; }
    .footer { margin-top:40px; font-size:0.75rem; }
}
</style>
</head>
<body>

<div class="container">
    <header><h1>蛙 仔 盲 盒 日 記</h1></header>
    <div class="mode-badge">數據管理後台</div>

    <div class="summary-box">
        <div class="summary-item"><span>人數</span><b id="sum-count">0</b></div>
        <div class="summary-item"><span>加值</span><b id="sum-addon">0</b></div>
        <div class="summary-item"><span>總計</span><b id="sum-spend">0</b></div>
    </div>

    <div class="input-group">
        <div class="input-row">
            <input type="date" id="in-d">
            <input type="text" id="in-n" placeholder="名字">
            <input type="text" id="in-c" placeholder="國籍">
        </div>
        <div class="input-row">
            <input type="text" id="in-s" placeholder="方案">
            <input type="text" id="in-a" placeholder="加值">
        </div>
        <div class="input-row">
            <input type="number" id="in-t" placeholder="小費">
            <input type="number" id="in-p" placeholder="金額">
        </div>
        <button class="add-btn" onclick="addNew()">新 增 記 錄</button>
    </div>

    <div class="table-wrapper">
        <div class="flex-row list-header">
            <span class="c-date">日期</span>
            <span class="c-name">名字</span>
            <span class="c-nat">國籍</span>
            <span class="c-plan">方案</span>
            <span class="c-add">加值</span>
            <span class="c-tip">小費</span>
            <span class="c-amt">金額</span>
        </div>
        
        <div id="data-container"></div>
    </div>

    <div class="footer">
        <span class="btn-link" onclick="exportData()">備份數據</span>
        <span class="btn-link" onclick="exportData()">匯入數據</span>
        <p style="margin-top:20px; opacity:0.4; letter-spacing:4px;">W A Z A I - D I A R Y</p>
    </div>
</div>

<script>
    const FULL_DATA_BACKUP = [
        {d:"2025-12-05", n:"陽光", c:"泰國", s:"", a:"2S", t:0, p:3500},
        {d:"2025-12-08", n:"軒墨", c:"泰國", s:"", a:"", t:0, p:6000},
        {d:"2025-12-25", n:"夏希", c:"泰國", s:"", a:"", t:0, p:5600},
        {d:"2025-12-28", n:"花乃", c:"泰國", s:"", a:"", t:0, p:2800},
        {d:"2025-12-31", n:"奈香", c:"泰國", s:"", a:"", t:0, p:5600},
        {d:"2026-01-03", n:"寶拉", c:"泰國", s:"", a:"", t:0, p:3000},
        {d:"2026-01-06", n:"亮亮", c:"泰國", s:"", a:"", t:0, p:5600},
        {d:"2026-01-10", n:"米莉", c:"泰國", s:"", a:"", t:0, p:5600},
        {d:"2026-01-17", n:"米莉", c:"泰國", s:"", a:"", t:0, p:5600},
        {d:"2026-01-25", n:"北茉", c:"泰國", s:"", a:"", t:0, p:5600},
        {d:"2026-01-29", n:"薇倩", c:"泰國", s:"", a:"", t:0, p:2500},
        {d:"2026-01-31", n:"薇倩", c:"泰國", s:"", a:"", t:0, p:5000},
        {d:"2026-02-08", n:"小賢", c:"泰國", s:"", a:"", t:0, p:3000},
        {d:"2026-02-08", n:"蘇打", c:"泰國", s:"", a:"", t:0, p:2500},
        {d:"2026-02-24", n:"幼寧", c:"泰國", s:"", a:"", t:0, p:5000},
        {d:"2026-03-01", n:"綺綺", c:"泰國", s:"", a:"", t:0, p:2800},
        {d:"2026-03-06", n:"甘蓓", c:"泰國", s:"", a:"", t:0, p:6000},
        {d:"2026-03-10", n:"芊卉", c:"泰國", s:"", a:"", t:0, p:2500},
        {d:"2026-03-22", n:"薇倩", c:"泰國", s:"", a:"", t:0, p:7500},
        {d:"2026-04-08", n:"小光", c:"泰國", s:"", a:"", t:0, p:2500},
        {d:"2026-04-18", n:"孟娜", c:"越南", s:"", a:"", t:0, p:7000},
        {d:"2026-05-01", n:"米露", c:"台灣", s:"", a:"口爆", t:0, p:3500},
        {d:"2026-05-03", n:"孟娜", c:"越南", s:"", a:"", t:0, p:10500}
    ];

    const STORAGE_KEY = 'frog_v12_pro';

    function getDB() {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
            const parsed = JSON.parse(local);
            return parsed.length < FULL_DATA_BACKUP.length ? FULL_DATA_BACKUP : parsed;
        }
        return FULL_DATA_BACKUP;
    }

    let db = getDB();
    let collapsedYears = {};

    function render() {
        const container = document.getElementById('data-container');
        container.innerHTML = '';
        let spend = 0, addons = 0;
        
        db.sort((x, y) => new Date(y.d) - new Date(x.d));
        const groups = {};
        
        db.forEach((item, index) => {
            const year = new Date(item.d).getFullYear() || "其他";
            if (!groups[year]) groups[year] = [];
            groups[year].push({...item, idx: index});
            spend += (parseInt(item.p || 0) + parseInt(item.t || 0));
            if(item.a) addons++;
        });

        Object.keys(groups).sort((a,b)=>b-a).forEach(year => {
            const isCollapsed = collapsedYears[year] ? 'collapsed' : '';
            const arrowClass = collapsedYears[year] ? 'rotate-arrow' : '';
            
            let yearHTML = `
                <div class="year-section">
                    <div class="year-header" onclick="toggleYear('${year}', this)">
                        <div class="year-title">${year} 年度紀錄</div>
                        <div class="arrow ${arrowClass}">▼</div>
                    </div>
                    <div id="cont-${year}" class="content-container ${isCollapsed}">`;
            
            groups[year].forEach(item => {
                const dateShow = item.d.split('-').slice(1).join('/');
                const addonSpan = item.a ? `<span class="pills addon-pill">${item.a}</span>` : '-';
                const planSpan = item.s ? `<span class="pills">${item.s}</span>` : '-';
                const tipShow = item.t > 0 ? item.t.toLocaleString() : '-';

                yearHTML += `
                    <div class="flex-row list-item">
                        <div class="c-date">${dateShow}</div>
                        <div class="c-name">${item.n}</div>
                        <div class="c-nat">${item.c || '-'}</div>
                        <div class="c-plan">${planSpan}</div>
                        <div class="c-add">${addonSpan}</div>
                        <div class="c-tip">${tipShow}</div>
                        <div class="c-amt">
                            <span>${parseInt(item.p).toLocaleString()}</span>
                            <button class="del-btn" onclick="del(${item.idx})">🗑️</button>
                        </div>
                    </div>`;
            });

            yearHTML += `</div></div>`;
            container.innerHTML += yearHTML;
        });

        document.getElementById('sum-count').innerText = db.length;
        document.getElementById('sum-addon').innerText = addons;
        document.getElementById('sum-spend').innerText = spend.toLocaleString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        
        document.querySelectorAll('.content-container').forEach(c => {
            if(!c.classList.contains('collapsed')) {
                c.style.maxHeight = c.scrollHeight + 'px';
            } else {
                c.style.maxHeight = '0px';
            }
        });
    }

    function toggleYear(year, headerEl) {
        const content = document.getElementById(`cont-${year}`);
        const arrow = headerEl.querySelector('.arrow');
        
        if (content.classList.contains('collapsed')) {
            content.classList.remove('collapsed');
            content.style.maxHeight = content.scrollHeight + 'px';
            arrow.classList.remove('rotate-arrow');
            collapsedYears[year] = false;
        } else {
            content.style.maxHeight = '0px';
            content.classList.add('collapsed');
            arrow.classList.add('rotate-arrow');
            collapsedYears[year] = true;
        }
    }

    function addNew() {
        const d = document.getElementById('in-d').value;
        const n = document.getElementById('in-n').value;
        const p = document.getElementById('in-p').value;
        
        if(!d || !n || !p) return alert('日期、名字與金額是必填的喔！');
        
        db.push({
            d, n, 
            c: document.getElementById('in-c').value, 
            s: document.getElementById('in-s').value, 
            a: document.getElementById('in-a').value, 
            t: parseInt(document.getElementById('in-t').value||0), 
            p: parseInt(p)
        });
        
        render();
        ['in-n','in-c','in-s','in-a','in-t','in-p'].forEach(id => document.getElementById(id).value = '');
    }

    function del(i) { 
        if(confirm('確定要刪除這筆紀錄嗎？')) { 
            db.splice(i, 1); 
            render(); 
        } 
    }
    
    function exportData() {
        const str = JSON.stringify(db);
        navigator.clipboard.writeText(str).then(() => alert('數據已安全複製到剪貼簿！可以貼到記事本存起來。'));
    }

    function importData() {
        const str = prompt('請貼上您之前備份的數據代碼：');
        if(str) {
            try { 
                db = JSON.parse(str); 
                render(); 
                alert('數據匯入成功！'); 
            } catch(e) { 
                alert('格式好像不太正確，請檢查是否有複製完整。'); 
            }
        }
    }

    window.addEventListener('load', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('in-d').value = today;
        render();
    });
</script>
</body>
</html>
