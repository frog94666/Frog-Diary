<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛙仔盲盒日記 - 數據管理後台 (自訂密碼版)</title>

<style>
:root{--bg-color:#f2f0eb;--card-bg:#ffffff;--accent:#7a6f66;--text-dark:#4a4a4a;--text-light:#9e9e9e;--line-color:#e8e6e1;--pill-bg:#ebe8e2;--pill-text:#8c837a;--addon-bg:#fdf2f2;--addon-text:#e59a9a;--btn-primary:#7a6f66;--btn-hover:#61564e;--delete-color:#e59a9a;--btn-update:#9c8c80;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body {
    background: var(--bg-color);
    color: var(--text-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-weight: 500;
    display: flex;
    justify-content: center;
    padding: 12px;
    letter-spacing: 0.5px;
}
.container{width:100%;max-width:480px;background:var(--card-bg);border-radius:24px;padding:20px 14px;box-shadow:0 8px 30px rgba(0,0,0,0.03);overflow:hidden;}

header{text-align:center;margin-bottom:20px;display:flex;flex-direction:column;align-items:center;width:100%;}
header h1 {
    font-weight: 700;
    letter-spacing: 8px;
    text-indent: 8px;
    font-size: 1.25rem;
    color: var(--accent);
    margin: 0 0 8px 0;
    width: 100%;
    text-align: center;
}

.badge {
    background: var(--addon-bg);
    color: var(--addon-text);
    font-size: 0.65rem;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bold;
    display: inline-block;
    text-align: center;
    letter-spacing: 0px !important;  
    text-indent: 0px !important;     
    margin: 0 auto !important;
    white-space: nowrap;
    width: fit-content;
}

/* 數據儀表板 */
.summary-box{background:#faf9f7;border-radius:16px;display:flex;margin-bottom:22px;border:1px solid var(--line-color);height:82px;overflow:hidden;}
.summary-item{flex:1;border-right:1px solid var(--line-color);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.summary-item:last-child{border-right:none;}
.summary-item span{font-size:0.65rem;color:var(--text-light);margin-bottom:4px;font-weight: 700;}
.summary-item b {
    font-size: 1.25rem;
    color: var(--accent);
    line-height: 1;
    font-weight: 700;
}

/* 表單容器 */
.form-box{background:#faf9f7;border:1px solid var(--line-color);border-radius:16px;padding:14px;margin-bottom:24px;display:flex;flex-direction:column;gap:8px;}

/* 橫排容器 */
.form-row-flexible {
    display: flex;
    gap: 8px;
    width: 100%;
}
.form-row-flexible input, .form-row-flexible select {
    flex: 1;
    min-width: 0;
}

input, select {
    width: 100% !important;
    height: 38px;
    border: 1px solid var(--line-color);
    border-radius: 10px;
    padding: 0 4px;
    font-size: 0.8rem;
    color: var(--text-dark);
    background: #fff;
    outline: none;
    transition: border .2s;
    text-align: center; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-variant-numeric: tabular-nums;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
input[type="number"] {
    -moz-appearance: textfield;
}

input:focus, select:focus { border-color: var(--accent); }
input::placeholder { color: #ccc; }

/* 按鈕 */
button.btn-submit {
    width: 100%;
    height: 44px;
    background: var(--btn-primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: 700; 
    letter-spacing: 6px; 
    text-indent: 6px;
    cursor: pointer;
    transition: background .2s;
    box-shadow: 0 4px 12px rgba(122,111,102,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
}
button.btn-submit:hover{background:var(--btn-hover);}
button.btn-submit.edit-mode { background: var(--btn-update); }
button:disabled{background:#ccc !important;cursor:not-allowed;box-shadow:none;}

.cancel-edit { text-align: center; font-size: 0.72rem; font-weight: 700; color: #e59a9a; margin-top: 4px; cursor: pointer; display: none; }

/* 表格欄位對齊 */
.table-wrapper{width:100%;}
.flex-row{display:flex;align-items:center;width:100%;text-align:center;padding:12px 0;min-width:0;}
.c-date{width:45px;flex-shrink:0;}
.c-name{width:52px;flex-shrink:0;font-weight:700;text-align:center;}
.c-nat{width:40px;flex-shrink:0;}
.c-plan,.c-add,.c-tip{flex:1;min-width:0;}
.c-amt {
    width: 70px;
    flex-shrink: 0;
    text-align: right;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.8rem;
}
.c-del{width:32px;flex-shrink:0;text-align:right;}

.list-header{border-bottom:1px solid var(--line-color);padding-bottom:10px;margin-bottom:6px;}
.list-header span{
    font-size:0.68rem;
    color:var(--text-light);
    font-weight:700;
}

.year-section{margin-bottom:10px;}

.year-header{background:#faf9f7;border-radius:12px;border:1px solid var(--line-color);margin:10px 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.year-title{
    font-size:0.88rem;
    font-weight:700; 
    color:var(--accent);
    letter-spacing: 0.5px;
}
.arrow{font-size:0.7rem;color:var(--text-light);transition:transform .35s ease;}
.rotate-arrow{transform:rotate(-90deg);}
.content-container{overflow:hidden;max-height:5000px;opacity:1;transition:max-height .45s ease,opacity .3s ease;}
.content-container.collapsed{max-height:0 !important;opacity:0;}

/* 歷史列表項目 */
.list-item{border-bottom:1px solid #f7f7f7;font-size:0.72rem;cursor:pointer;transition:background 0.2s;}
.list-item:hover{background:#faf9f7;}
.list-item.selected-for-edit { background: #fdfaf2; border-left: 3px solid #e5c19a; }

.pills {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    background: var(--pill-bg);
    color: var(--pill-text);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    line-height: 1; 
}
.addon-pill{background:var(--addon-bg);color:var(--addon-text);}

.btn-delete{background:none;border:none;color:var(--delete-color);cursor:pointer;font-size:0.85rem;padding:0 4px;opacity:0.6;transition:opacity .2s;}
.btn-delete:hover{opacity:1;}
.loading{text-align:center;padding:30px;font-size:0.8rem;color:var(--text-light);letter-spacing:2px;font-weight:700;}
.footer{text-align:center;margin-top:32px;padding:12px;font-size:0.62rem;color:var(--text-light);opacity:0.4;letter-spacing:4px;}

/* 登出按鈕樣式 */
.logout-box { text-align: center; margin-top: 10px; }
.btn-logout { background: none; border: none; color: var(--text-light); font-size: 0.65rem; text-decoration: underline; cursor: pointer; font-weight: bold; }

@media (max-width:480px){.container{border-radius:20px;padding:18px 12px;}.list-item{font-size:0.7rem;}.c-date{width:42px;}.c-name{width:48px;}.c-nat{width:36px;}.c-amt{width:65px;}}
@media (min-width:900px) {
    body{padding:30px;}.container{max-width:760px;padding:30px 26px;border-radius:30px;}
    header h1{font-size:1.7rem;letter-spacing:14px;text-indent:14px;}
    .badge{font-size:0.75rem;padding:5px 16px;} 
    .summary-box{height:95px;margin-bottom:28px;}.summary-item span{font-size:0.8rem;}.summary-item b{font-size:1.5rem;}.form-box{padding:22px;margin-bottom:32px;}
    .form-row-flexible{gap:12px;}
    input,select{height:46px;font-size:0.95rem;border-radius:12px;padding:0 8px;}button.btn-submit{height:52px;font-size:1.05rem;border-radius:14px;letter-spacing:10px;text-indent:10px;}.flex-row{padding:18px 0;}.list-header span{font-size:0.82rem;}.list-item{font-size:0.95rem;}.year-header{padding:18px 20px;}.year-title{font-size:1.05rem;}.c-date{width:70px;}.c-name{width:85px;}.c-nat{width:65px;}.c-amt{width:110px;font-size:0.95rem;}.c-del{width:45px;}.btn-delete{font-size:1.1rem;}.footer{margin-top:40px;font-size:0.75rem;}
}
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>蛙仔盲盒日記</h1>
        <span class="badge">數據管理後台</span>
    </header>
    
    <div id="loading-view" class="loading">正在驗證身分並連線中...</div>

    <div id="main-view" style="display:none;">
        <div class="summary-box">
            <div class="summary-item"><span>人數</span><b id="sum-count">0</b></div>
            <div class="summary-item"><span>總計</span><b id="sum-spend">0</b></div>
        </div>

        <div class="form-box">
            <div class="form-row-flexible">
                <input type="date" id="f-date">
                <input type="text" id="f-name" placeholder="名字">
                <input type="text" id="f-nat" placeholder="國籍">
            </div>
            
            <div class="form-row-flexible">
                <input type="text" id="f-plan" placeholder="方案">
                <input type="text" id="f-add" placeholder="加值">
            </div>
            
            <div class="form-row-flexible">
                <input type="number" id="f-tip" placeholder="小費">
                <input type="number" id="f-amt" placeholder="金額">
            </div>
            
            <button class="btn-submit" id="btn-save" onclick="handleSubmit()">新 增 記 錄</button>
            <div id="cancel-edit" class="cancel-edit" onclick="exitEditMode()">取消修改，返回新增模式</div>
        </div>

        <div class="table-wrapper">
            <div class="flex-row list-header">
                <span class="c-date">日期</span><span class="c-name">名字</span><span class="c-nat">國籍</span><span class="c-plan">方案</span><span class="c-add">加值</span><span class="c-tip">小費</span><span class="c-amt">金額</span><span class="c-del"></span>
            </div>
            <div id="data-container"></div>
        </div>
        
        <div class="logout-box">
            <button class="btn-logout" onclick="logout()">🔒 登出並清除密碼記憶</button>
        </div>
    </div>
    <div class="footer">W A Z A I - D I A R Y</div>
</div>

<script>
    // ⚙️ 在這裡設定你想要的日常密碼！
    const SECURITY_SETTING = {
        CUSTOM_PASSWORD: "Aa810502", // 👈 把這裡的中文字改成你自己要的日常密碼 (例如: "1234")
        REAL_TOKEN_SUF: "2v5vgl44x445cys8djSgxp7kebIkiQ3ZmT0O" // 真正的 GitHub 金鑰後半段
    };

    const CONFIG = {
        T_PRE: "ghp_", 
        GIST_ID: "ea604c159439173860a439882f615076"
    };

    let db = [];
    let collapsedYears = {};
    let editingId = null;
    let isVerified = false;

    // 取得完整金鑰的函數
    function getFullToken() {
        // 先檢查瀏覽器有沒有記錄「密碼驗證成功」的標記
        let savedPass = localStorage.getItem('wazai_custom_pass') || "";
        
        if (savedPass !== SECURITY_SETTING.CUSTOM_PASSWORD) {
            // 沒有記住，或者密碼不對，彈出視窗詢問
            const userInput = prompt("🔒 請輸入管理員自訂密碼：");
            if (userInput && userInput.trim() === SECURITY_SETTING.CUSTOM_PASSWORD) {
                localStorage.setItem('wazai_custom_pass', SECURITY_SETTING.CUSTOM_PASSWORD);
                isVerified = true;
            } else if (userInput) {
                alert("❌ 密碼錯誤！無法載入後台。");
                return null;
            } else {
                return null;
            }
        } else {
            isVerified = true;
        }

        // 驗證成功，拼湊出真正的 GitHub Token 去撈資料
        return CONFIG.T_PRE + SECURITY_SETTING.REAL_TOKEN_SUF;
    }

    async function loadData() {
        try {
            const token = getFullToken();
            if (!isVerified || !token) {
                document.getElementById('loading-view').innerText = "❌ 拒絕存取：未輸入正確的管理員密碼。請重新整理網頁。";
                return;
            }

            const res = await fetch(`https://api.github.com/gists/${CONFIG.GIST_ID}`, {
                headers: { "Authorization": `token ${token}` }
            });
            
            if (res.status === 401 || res.status === 403) {
                logout();
                alert("雲端金鑰已失效，請聯絡開發人員確認！");
                return;
            }

            const data = await res.json();
            db = JSON.parse(data.files["data.json"].content || "[]");
            
            db.forEach((item, index) => {
                if(!item.id) item.id = 'id_' + Date.now() + '_' + index;
            });

            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            
            resetDateToToday();
            render();
        } catch (e) {
            document.getElementById('loading-view').innerText = "資料庫連線失敗，請稍後再試。";
        }
    }

    function logout() {
        localStorage.removeItem('wazai_custom_pass');
        isVerified = false;
        location.reload();
    }

    function resetDateToToday() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('f-date').value = `${yyyy}-${mm}-${dd}`;
    }

    async function syncToCloud() {
        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.innerText = "正在同步到雲端...";
        try {
            const token = CONFIG.T_PRE + SECURITY_SETTING.REAL_TOKEN_SUF;
            await fetch(`https://api.github.com/gists/${CONFIG.GIST_ID}`, {
                method: 'PATCH',
                headers: { 
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    files: { "data.json": { content: JSON.stringify(db, null, 2) } }
                })
            });
            exitEditMode();
            render();
        } catch (e) {
            alert("雲端同步失敗，請重新整理網頁再試一次！");
        } finally {
            btn.disabled = false;
            updateButtonUI();
        }
    }

    function handleSubmit() {
        const d = document.getElementById('f-date').value;
        const n = document.getElementById('f-name').value.trim();
        const c = document.getElementById('f-nat').value.trim();
        const s = document.getElementById('f-plan').value.trim();
        const a = document.getElementById('f-add').value.trim();
        const t = parseInt(document.getElementById('f-tip').value) || 0;
        const p = parseInt(document.getElementById('f-amt').value) || 0;

        if (!d || !n) { alert("請填寫日期與名字！"); return; }

        if (editingId) {
            const index = db.findIndex(item => item.id === editingId);
            if (index !== -1) {
                db[index].d = d;
                db[index].n = n;
                db[index].c = c;
                db[index].s = s;
                db[index].a = a;
                db[index].t = t;
                db[index].p = p;
            }
        } else {
            db.push({ id: Date.now().toString(), d, n, c, s, a, t, p });
        }

        syncToCloud();
    }

    function enterEditMode(id) {
        const item = db.find(x => x.id === id);
        if (!item) return;

        editingId = id;
        document.getElementById('f-date').value = item.d;
        document.getElementById('f-name').value = item.n;
        document.getElementById('f-nat').value = item.c || '';
        document.getElementById('f-plan').value = item.s || '';
        document.getElementById('f-add').value = item.a || '';
        document.getElementById('f-tip').value = item.t || '';
        document.getElementById('f-amt').value = item.p || '';

        updateButtonUI();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exitEditMode() {
        editingId = null;
        resetDateToToday();
        document.getElementById('f-name').value = '';
        document.getElementById('f-nat').value = '';
        document.getElementById('f-plan').value = '';
        document.getElementById('f-add').value = '';
        document.getElementById('f-tip').value = '';
        document.getElementById('f-amt').value = '';
        updateButtonUI();
        render();
    }

    function updateButtonUI() {
        const btn = document.getElementById('btn-save');
        const cancelBtn = document.getElementById('cancel-edit');
        if (editingId) {
            btn.innerText = "更 新 記 錄";
            btn.classList.add('edit-mode');
            cancelBtn.style.display = 'block';
        } else {
            btn.innerText = "新 增 記 錄";
            btn.classList.remove('edit-mode');
            cancelBtn.style.display = 'none';
        }
    }

    function deleteItem(id) {
        if (!confirm("確定要刪除這筆紀錄嗎？")) return;
        db = db.filter(item => item.id !== id);
        if (editingId === id) exitEditMode();
        syncToCloud();
    }

    function render() {
        const container = document.getElementById('data-container');
        container.innerHTML = '';
        let spend = 0;
        
        db.sort((x, y) => new Date(y.d) - new Date(x.d));
        const groups = {};
        
        db.forEach(item => {
            const year = new Date(item.d).getFullYear() || "其他";
            if (!groups[year]) groups[year] = [];
            groups[year].push(item);
            spend += (parseInt(item.p || 0) + parseInt(item.t || 0));
        });

        Object.keys(groups).sort((a,b)=>b-a).forEach(year => {
            const isCollapsed = collapsedYears[year] ? 'collapsed' : '';
            const arrowClass = collapsedYears[year] ? 'rotate-arrow' : '';
            let yearHTML = `<div class="year-section"><div class="year-header" onclick="toggleYear('${year}', this)"><div class="year-title">${year} 年度紀錄</div><div class="arrow ${arrowClass}">▼</div></div><div id="cont-${year}" class="content-container ${isCollapsed}">`;
            
            groups[year].forEach(item => {
                const dateShow = item.d.split('-').slice(1).join('/');
                const addonSpan = item.a ? `<span class="pills addon-pill">${item.a}</span>` : '-';
                const planSpan = item.s ? `<span class="pills">${item.s}</span>` : '-';
                const tipShow = item.t > 0 ? item.t.toLocaleString() : '-';
                const isSelected = item.id === editingId ? 'selected-for-edit' : '';
                
                yearHTML += `
                <div class="flex-row list-item ${isSelected}" onclick="enterEditMode('${item.id}')">
                    <div class="c-date">${dateShow}</div>
                    <div class="c-name">${item.n}</div>
                    <div class="c-nat">${item.c || '-'}</div>
                    <div class="c-plan">${planSpan}</div>
                    <div class="c-add">${addonSpan}</div>
                    <div class="c-tip">${tipShow}</div>
                    <div class="c-amt">${parseInt(item.p).toLocaleString()}</div>
                    <div class="c-del">
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteItem('${item.id}')">🗑️</button>
                    </div>
                </div>`;
            });
            yearHTML += `</div></div>`;
            container.innerHTML += yearHTML;
        });

        document.getElementById('sum-count').innerText = db.length;
        document.getElementById('sum-spend').innerText = spend.toLocaleString();
        
        document.querySelectorAll('.content-container').forEach(c => {
            c.style.maxHeight = c.classList.contains('collapsed') ? '0px' : c.scrollHeight + 'px';
        });
    }

    function toggleYear(year, headerEl) {
        const content = document.getElementById(`cont-${year}`);
        const arrow = headerEl.querySelector('.arrow');
        if (content.classList.contains('collapsed')) {
            content.classList.remove('collapsed');
            content.style.maxHeight = content.scrollHeight + 'px';
            arrow.classList.remove('rotate-arrow');
            collapsedYears[year] = false;
        } else {
            content.style.maxHeight = '0px';
            content.classList.add('collapsed');
            arrow.classList.add('rotate-arrow');
            collapsedYears[year] = true;
        }
    }

    window.addEventListener('load', loadData);
</script>
</body>
</html>
