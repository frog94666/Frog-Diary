<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛙仔盲盒日記 - 數據管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{--bg-color:#f2f0eb;--card-bg:#ffffff;--accent:#7a6f66;--text-dark:#4a4a4a;--text-light:#9e9e9e;--line-color:#e8e6e1;--pill-bg:#ebe8e2;--pill-text:#8c837a;--addon-bg:#fdf2f2;--addon-text:#e59a9a;--btn-primary:#7a6f66;--btn-hover:#61564e;--delete-color:#e59a9a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body {
    background: var(--bg-color);
    color: var(--text-dark);
    /* 🛠️ 全域套用超 Q 彈的圓體字型 */
    font-family: "Zen Maru Gothic", "Mochiy Pop One", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-weight: 500;
    display: flex;
    justify-content: center;
    padding: 12px;
}
.container{width:100%;max-width:480px;background:var(--card-bg);border-radius:24px;padding:20px 14px;box-shadow:0 8px 30px rgba(0,0,0,0.03);overflow:hidden;}
header{text-align:center;margin-bottom:20px;}
header h1 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    letter-spacing: 6px;
    font-size: 1.3rem;
    color: var(--accent);
    margin: 0 0 4px 0;
}
.badge{background:var(--addon-bg);color:var(--addon-text);font-size:0.6rem;padding:2px 8px;border-radius:20px;font-weight:bold;letter-spacing:1px;}

/* 數據儀表板數字使用 Q 彈字體 */
.summary-box{background:#faf9f7;border-radius:16px;display:flex;margin-bottom:22px;border:1px solid var(--line-color);height:82px;overflow:hidden;}
.summary-item{flex:1;border-right:1px solid var(--line-color);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.summary-item:last-child{border-right:none;}
.summary-item span{font-size:0.65rem;color:var(--text-light);margin-bottom:4px;}
.summary-item b {
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-size: 1.15rem;
    color: var(--accent);
    line-height: 1;
}

.form-box{background:#faf9f7;border:1px solid var(--line-color);border-radius:16px;padding:14px;margin-bottom:24px;}
.form-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.form-row-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px;}
.form-row-1{display:grid;grid-template-columns:1fr;gap:8px;}

/* 輸入框字體同步為圓體 */
input,select{width:100%;height:38px;border:1px solid var(--line-color);border-radius:10px;padding:0 10px;font-size:0.8rem;color:var(--text-dark);background:#fff;outline:none;transition:border .2s;font-family:inherit;font-weight:500;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:#ccc;}

button.btn-submit {
    width: 100%;
    height: 44px;
    background: var(--btn-primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    transition: background .2s;
    box-shadow: 0 4px 12px rgba(122,111,102,0.15);
}
button.btn-submit:hover{background:var(--btn-hover);}
button:disabled{background:#ccc !important;cursor:not-allowed;box-shadow:none;}
.table-wrapper{width:100%;}
.flex-row{display:flex;align-items:center;width:100%;text-align:center;padding:12px 0;min-width:0;}
.c-date{width:45px;flex-shrink:0;}
.c-name{width:52px;flex-shrink:0;font-weight:700;text-align:center;}
.c-nat{width:40px;flex-shrink:0;}
.c-plan,.c-add,.c-tip{flex:1;min-width:0;}
.c-amt {
    width: 70px;
    flex-shrink: 0;
    text-align: right;
    font-weight: 700;
    color: var(--accent);
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-size: 0.75rem;
}
.c-del{width:32px;flex-shrink:0;text-align:right;}
.list-header{border-bottom:1px solid var(--line-color);padding-bottom:10px;margin-bottom:6px;}
.list-header span{font-size:0.65rem;color:var(--text-light);font-weight:700;}
.year-section{margin-bottom:10px;}
.year-header{background:#faf9f7;border-radius:12px;border:1px solid var(--line-color);margin:10px 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.year-title{font-size:0.9rem;font-weight:700;color:var(--accent);}
.arrow{font-size:0.7rem;color:var(--text-light);transition:transform .35s ease;}
.rotate-arrow{transform:rotate(-90deg);}
.content-container{overflow:hidden;max-height:5000px;opacity:1;transition:max-height .45s ease,opacity .3s ease;}
.content-container.collapsed{max-height:0 !important;opacity:0;}
.list-item{border-bottom:1px solid #f7f7f7;font-size:0.72rem;}

/* 方案與加值大字體膠囊微調 */
.pills {
    display: inline-block;
    font-size: 100%;
    font-weight: 700;
    background: var(--pill-bg);
    color: var(--pill-text);
    padding: 1px 7px;
    border-radius: 6px;
    white-space: nowrap;
}
.addon-pill{background:var(--addon-bg);color:var(--addon-text);}

.btn-delete{background:none;border:none;color:var(--delete-color);cursor:pointer;font-size:0.85rem;padding:0 4px;opacity:0.6;transition:opacity .2s;}
.btn-delete:hover{opacity:1;}
.loading{text-align:center;padding:30px;font-size:0.8rem;color:var(--text-light);letter-spacing:2px;}
.footer{text-align:center;margin-top:32px;padding:12px;font-size:0.62rem;color:var(--text-light);opacity:0.4;letter-spacing:4px;}
