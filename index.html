<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛙仔盲盒日記 - 蛙仔朋友版</title>

<style>
:root{--bg-color:#f2f0eb;--card-bg:#ffffff;--accent:#7a6f66;--text-dark:#4a4a4a;--text-light:#9e9e9e;--line-color:#e8e6e1;--pill-bg:#ebe8e2;--pill-text:#8c837a;--addon-bg:#fdf2f2;--addon-text:#e59a9a;--btn-primary:#7a6f66;--btn-hover:#61564e;--delete-color:#e59a9a;--btn-update:#9c8c80;}
*{box-shadow:none;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body {
    background: var(--bg-color);
    color: var(--text-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-weight: 500;
    display: flex;
    justify-content: center;
    padding: 12px;
    letter-spacing: 0.5px;
}
.container{width:100%;max-width:480px;background:var(--card-bg);border-radius:24px;padding:20px 14px;box-shadow:0 8px 30px rgba(0,0,0,0.03);overflow:hidden;}

header{text-align:center;margin-bottom:20px;display:flex;flex-direction:column;align-items:center;width:100%;}
header h1 {
    font-weight: 700;
    letter-spacing: 8px;
    text-indent: 8px;
    font-size: 1.25rem;
    color: var(--accent);
    margin: 0 0 8px 0;
    width: 100%;
    text-align: center;
}

.badge {
    background: var(--addon-bg);
    color: var(--addon-text);
    font-size: 0.65rem;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bold;
    display: inline-block;
    text-align: center;
    letter-spacing: 0px !important;  
    text-indent: 0px !important;     
    margin: 0 auto !important;
    white-space: nowrap;
    width: fit-content;
}

/* 數據儀表板 (朋友版保持左右平分，簡潔好看) */
.summary-box{background:#faf9f7;border-radius:16px;display:flex;margin-bottom:22px;border:1px solid var(--line-color);height:82px;overflow:hidden;}
.summary-item{flex:1;border-right:1px solid var(--line-color);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.summary-item:last-child{border-right:none;}
.summary-item span{font-size:0.65rem;color:var(--text-light);margin-bottom:4px;font-weight: 700;}
.summary-item b {
    font-size: 1.25rem;
    color: var(--accent);
    line-height: 1;
    font-weight: 700;
}

/* 歷史列表欄位對齊 (電腦與標準版基礎 - 拿掉垃圾桶寬度重新分配) */
.table-wrapper{width:100%;}
.flex-row{display:flex;align-items:center;width:100%;text-align:center;padding:12px 0;min-width:0;}
.c-date{width:55px;flex-shrink:0;}
.c-name{width:70px;flex-shrink:0;font-weight:700;text-align:center;}
.c-nat{width:55px;flex-shrink:0;}
.c-plan{width:105px;flex-shrink:0;}
.c-add{width:70px;flex-shrink:0;}
.c-tip{width:60px;flex-shrink:0;}
.c-amt {
    flex: 1;
    text-align: right;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.8rem;
    padding-right: 6px; /* 讓金額精準貼齊右側邊緣 */
}

.list-header{border-bottom:1px solid var(--line-color);padding-bottom:10px;margin-bottom:6px;}
.list-header span{
    font-size:0.68rem;
    color:var(--text-light);
    font-weight:700;
}

.year-section{margin-bottom:10px;}
.year-header{background:#faf9f7;border-radius:12px;border:1px solid var(--line-color);margin:10px 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.year-title{font-size:0.88rem;font-weight:700;color:var(--accent);letter-spacing:0.5px;}
.arrow{font-size:0.7rem;color:var(--text-light);transition:transform .35s ease;}
.rotate-arrow{transform:rotate(-90deg);}
.content-container{overflow:hidden;max-height:5000px;opacity:1;transition:max-height .45s ease,opacity .3s ease;}
.content-container.collapsed{max-height:0 !important;opacity:0;}

/* 歷史列表項目 */
.list-item{border-bottom:1px solid #f7f7f7;font-size:0.72rem;transition:background 0.2s;}

.pills {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--pill-bg);
    color: var(--pill-text);
    padding: 3px 6px;
    border-radius: 6px;
    white-space: nowrap;
    line-height: 1; 
}
.addon-pill{background:var(--addon-bg);color:var(--addon-text);}

.loading{text-align:center;padding:30px;font-size:0.8rem;color:var(--text-light);letter-spacing:2px;font-weight:700;}
.footer{text-align:center;margin-top:32px;padding:12px;font-size:0.62rem;color:var(--text-light);opacity:0.4;letter-spacing:4px;}

/* 📱 手機版 RWD 完美對稱微調（對齊數據版間距，拿掉垃圾桶並均分空間） */
@media (max-width:480px){
    .container{border-radius:20px;padding:18px 12px;}
    
    /* 歷史列表寬度重新分配，完美治好對不齊與過度空曠的問題 */
    .list-item{font-size:0.68rem;}
    .c-date{width:38px;}
    .c-name{width:46px;}
    .c-nat{width:32px;}
    
    /* 膠囊自適應，縮小內襯，避免擠壓 */
    .c-plan{flex: 1.2; min-width: 0; width: auto;}
    .c-add{flex: 0.9; min-width: 0; width: auto;}
    .pills { font-size: 0.62rem; padding: 2px 3px; letter-spacing: -0.3px; }
    
    /* 小費與金額重新分配，與數據版寬度視覺體感一致 */
    .c-tip{width:32px;}
    .c-amt{flex: 1; text-align: right; font-size:0.68rem; padding-right: 4px;}
}

/* 🖥️ 電腦版 RWD 格式 */
@media (min-width:900px) {
    body{padding:30px;}.container{max-width:850px;padding:30px 26px;border-radius:30px;}
    header h1{font-size:1.7rem;letter-spacing:14px;text-indent:14px;}
    .badge{font-size:0.75rem;padding:5px 16px;} 
    .summary-box{height:95px;margin-bottom:28px;}.summary-item span{font-size:0.8rem;}.summary-item b{font-size:1.5rem;}
    .flex-row{padding:18px 0;}
    .list-header span{font-size:0.82rem;}
    .list-item{font-size:0.95rem;}
    .year-header{padding:18px 20px;}.year-title{font-size:1.05rem;}
    
    .c-date{width:80px;}
    .c-name{width:100px;}
    .c-nat{width:80px;}
    .c-plan{width:160px;}
    .c-add{width:110px;}
    .c-tip{width:90px;}
    .c-amt{flex:1; font-size:0.95rem; padding-right:12px;}
    .footer{margin-top:40px;font-size:0.75rem;}
    .pills { font-size: 0.8rem; padding: 4px 8px; }
}
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>蛙仔盲盒日記</h1>
        <span class="badge">蛙仔朋友版</span>
    </header>
    
    <div id="loading-view" class="loading">正在連線雲端資料庫...</div>

    <div id="main-view" style="display:none;">
        <div class="summary-box">
            <div class="summary-item"><span>人數</span><b id="sum-count">0</b></div>
            <div class="summary-item"><span>總計</span><b id="sum-spend">0</b></div>
        </div>

        <div class="table-wrapper">
            <div class="flex-row list-header">
                <span class="c-date">日期</span><span class="c-name">名字</span><span class="c-nat">國籍</span><span class="c-plan">方案</span><span class="c-add">加值</span><span class="c-tip">小費</span><span class="c-amt">金額</span>
            </div>
            <div id="data-container"></div>
        </div>
    </div>
    <div class="footer">W A Z A I - D I A R Y</div>
</div>

<script>
    const CONFIG = {
        GIST_ID: "ea604c159439173860a439882f615076"
    };

    let db = [];
    let collapsedYears = {};

    async function loadData() {
        try {
            // 朋友版使用公開的無需 Token 讀取
            const res = await fetch(`https://api.github.com/gists/${CONFIG.GIST_ID}`);
            if (!res.ok) throw new Error();
            
            const data = await res.json();
            db = JSON.parse(data.files["data.json"].content || "[]");
            
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            
            render();
        } catch (e) {
            document.getElementById('loading-view').innerText = "資料庫連線失敗，請稍後再試。";
        }
    }

    function render() {
        const container = document.getElementById('data-container');
        container.innerHTML = '';
        let spend = 0;
        
        db.sort((x, y) => new Date(y.d) - new Date(x.d));
        const groups = {};
        
        db.forEach(item => {
            const year = new Date(item.d).getFullYear() || "其他";
            if (!groups[year]) groups[year] = [];
            groups[year].push(item);
            spend += (parseInt(item.p || 0) + parseInt(item.t || 0));
        });

        Object.keys(groups).sort((a,b)=>b-a).forEach(year => {
            const isCollapsed = collapsedYears[year] ? 'collapsed' : '';
            const arrowClass = collapsedYears[year] ? 'rotate-arrow' : '';
            let yearHTML = `<div class="year-section"><div class="year-header" onclick="toggleYear('${year}', this)"><div class="year-title">${year} 年度紀錄</div><div class="arrow ${arrowClass}">▼</div></div><div id="cont-${year}" class="content-container ${isCollapsed}">`;
            
            groups[year].forEach(item => {
                const dateShow = item.d.split('-').slice(1).join('/');
                const addonSpan = item.a ? `<span class="pills addon-pill">${item.a}</span>` : '-';
                const planSpan = item.s ? `<span class="pills">${item.s}</span>` : '-';
                const tipShow = item.t > 0 ? item.t.toLocaleString() : '-';
                
                yearHTML += `
                <div class="flex-row list-item">
                    <div class="c-date">${dateShow}</div>
                    <div class="c-name">${item.n}</div>
                    <div class="c-nat">${item.c || '-'}</div>
                    <div class="c-plan">${planSpan}</div>
                    <div class="c-add">${addonSpan}</div>
                    <div class="c-tip">${tipShow}</div>
                    <div class="c-amt">${parseInt(item.p).toLocaleString()}</div>
                </div>`;
            });
            yearHTML += `</div></div>`;
            container.innerHTML += yearHTML;
        });

        document.getElementById('sum-count').innerText = db.length;
        document.getElementById('sum-spend').innerText = spend.toLocaleString();
        
        document.querySelectorAll('.content-container').forEach(c => {
            c.style.maxHeight = c.classList.contains('collapsed') ? '0px' : c.scrollHeight + 'px';
        });
    }

    function toggleYear(year, headerEl) {
        const content = document.getElementById(`cont-${year}`);
        const arrow = headerEl.querySelector('.arrow');
        if (content.classList.contains('collapsed')) {
            content.classList.remove('collapsed');
            content.style.maxHeight = content.scrollHeight + 'px';
            arrow.classList.remove('rotate-arrow');
            collapsedYears[year] = false;
        } else {
            content.style.maxHeight = '0px';
            content.classList.add('collapsed');
            arrow.classList.add('rotate-arrow');
            collapsedYears[year] = true;
        }
    }

    window.addEventListener('load', loadData);
</script>
</body>
</html>
